services:
  - type: web
    name: driverent-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    autoDeploy: false
    healthCheckPath: /health
    preDeployCommand: .venv/bin/alembic upgrade head
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: driverent-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: driverent-db
    databaseName: driverent
    user: driverent
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: []

