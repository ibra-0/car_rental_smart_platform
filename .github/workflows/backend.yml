name: Backend
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: driverent
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: driverent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U driverent -d driverent_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://driverent:test-password@localhost:5432/driverent_test
      TEST_DATABASE_URL: postgresql+psycopg://driverent:test-password@localhost:5432/driverent_test
      JWT_SECRET: ci-only-secret-key-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.28"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest

